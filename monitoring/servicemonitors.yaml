# 5. Orchestrator PodMonitoring (메트릭 목록 갱신 — pipeline_* 계열은 실제로 없음)
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: anomaly-orchestrator-monitoring
  namespace: elastic
  labels:
    app: anomaly-orchestrator
    tier: api
spec:
  selector:
    matchLabels:
      app: anomaly-orchestrator
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
    # 실제 수집되는 메트릭 (orchestrator_agentic.py 기준):
    # - track_total{track}                              # fast | deep
    # - planner_calls_total{status}                      # success | timeout | http_error | fallback | no_url
    #     ★ status!="success" 비율이 controller 장애/폴백 오염 여부의 핵심 지표
    # - service_latency_seconds_bucket{service}
    # - retry_attempts_total{service, attempt}
    # - validation_errors_total{field}


# 6. Locust PodMonitoring — 로드테스트 시에만 배포되는 job, 상시 아님
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: locust-monitoring
  namespace: elastic
  labels:
    app: locust
    tier: testing
spec:
  selector:
    matchLabels:
      app: locust
      role: master
  endpoints:
  - port: 8089
    interval: 30s
    path: /stats/requests

# ===========================
# 배포 / 확인 명령어
# ===========================
#
# 적용:
#   kubectl apply -f servicemonitors.yaml
#
# 등록 확인:
#   kubectl get podmonitoring -n elastic
#   kubectl describe podmonitoring local-analyzer-monitoring -n elastic
#   kubectl describe podmonitoring controller-monitoring -n elastic
#
# GMP collector가 실제로 스크랩하고 있는지 (가장 먼저 볼 로그):
#   kubectl logs -n gmp-system -l app.kubernetes.io/name=collector --tail=100 | grep -E "local-analyzer|controller"
#
# 엔드포인트 자체가 살아있는지 직접 확인 (PodMonitoring 문제인지 앱 문제인지 분리):
#   kubectl port-forward -n elastic svc/local-analyzer 8080:80 &
#   curl http://localhost:8080/metrics | head -30
#   kubectl port-forward -n elastic svc/controller 8080:80 &   # 서비스 이름은 실제 Service manifest 기준으로 조정
#   curl http://localhost:8080/metrics | head -30
#
# Cloud Monitoring(Metrics Explorer / PromQL)에서 수집 확인:
#   gcloud monitoring time-series list \
#     --filter='metric.type="prometheus.googleapis.com/analyzer_latency_seconds/histogram"' \
#     --format=json
#
# PromQL 예시 (Grafana/Cloud Monitoring 쿼리창에서 바로 사용):
#   # agent 경로 분포
#   sum by (path) (rate(agent_path_total[5m]))
#   # controller 폴백 비율 (가장 중요 — 최근 사고의 핵심 지표)
#   sum(rate(planner_calls_total{status!="success"}[5m])) / sum(rate(planner_calls_total[5m]))
#   # analyzer P95 latency
#   histogram_quantile(0.95, sum by (le) (rate(analyzer_latency_seconds_bucket[5m])))