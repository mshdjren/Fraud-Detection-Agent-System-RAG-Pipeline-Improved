# ===========================
# GKE Managed Prometheus PodMonitoring
# Updated for Agent Loop Pipeline (controller.py LangGraph + GGUF local-analyzer)
# ===========================
#
# V3(구버전) 대비 변경 사항:
#   - anomaly-analyzer → local-analyzer로 서비스 자체가 교체됨 (GGUF/HF 백엔드,
#     port 8080). PodMonitoring도 app: local-analyzer로 갱신.
#   - controller(신규) 추가 — LangGraph StateGraph 기반 agent loop 서비스.
#     V3엔 없던 컴포넌트라 PodMonitoring 자체가 없었음.
#   - Locust는 로드테스트 시에만 뜨는 job이라 "optional" 명시, 상시 배포 아님.
#   - 하단 ClusterPodMonitoring(tier: fraud-detection 라벨 기반)은 제거함 —
#     실제 배포 yaml들의 tier 라벨이 서비스마다 제각각(inference/routing/search/api)
#     이라 매칭이 안 됐음. 라벨을 통일하기 전까진 아래 개별 PodMonitoring들이
#     사실상 동일 효과를 이미 커버하므로 중복 제거.

# Elasticsearch PodMonitoring (변경 없음)
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: elasticsearch
  namespace: elastic
spec:
  selector:
    matchLabels:
      app.stateful/component: elasticsearch
      elasticsearch.k8s.elastic.co/cluster-name: elasticsearch-ha
  endpoints:
  - port: 9114
    interval: 30s
    path: /metrics

# ===========================
# Fraud Detection Agent Pipeline
# ===========================

# 1. Router PodMonitoring (변경 없음 — router.py 메트릭 그대로 유지됨)
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: anomaly-router-monitoring
  namespace: elastic
  labels:
    app: anomaly-router
    tier: routing
spec:
  selector:
    matchLabels:
      app: anomaly-router
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
    # 실제 수집되는 메트릭 (router.py 기준):
    # - percolate_requests_total{experiment_case, version}
    # - percolate_matching_time_ms_bucket{experiment_case, version}
    # - preprocessing_latency_ms_bucket{experiment_case}
    # - cluster_hits_total{cluster_id, experiment_case, version}
    # - hot_clusters_count (gauge)
    # - match_type_total{experiment_case, version, match_type}
    # - centroid_fallback_latency_ms_bucket{experiment_case, version}
    # - persona_delivered_total{has_persona}
    # - skip_analyzer_requests{experiment_case, cluster_id}

# 2. Retriever PodMonitoring (변경 없음 — retriever.py 메트릭 그대로 유지됨)
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: anomaly-retriever-monitoring
  namespace: elastic
  labels:
    app: anomaly-retriever
    tier: search
spec:
  selector:
    matchLabels:
      app: anomaly-retriever
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
    # 실제 수집되는 메트릭 (retriever.py 기준):
    # - retriever_search_latency_ms_bucket{search_mode, index_name, experiment_label}
    # - retriever_page_fault_delta_bucket{index_name}
    # - retriever_es_fielddata_bytes / retriever_es_query_cache_bytes (gauge)
    # - retriever_es_jvm_heap_percent (gauge)
    # - retriever_top1_distance_bucket{index_name, experiment_label}  ← raw L2, 정규화 전 값
    # - retriever_skip_analyzer_total{index_name, experiment_label}

# 3. Local Analyzer PodMonitoring (★ anomaly-analyzer에서 이름/라벨 교체됨)
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: local-analyzer-monitoring
  namespace: elastic
  labels:
    app: local-analyzer
    tier: inference
spec:
  selector:
    matchLabels:
      app: local-analyzer
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
    # 실제 수집되는 메트릭 (local_analyzer.py 기준):
    # - analyzer_requests_total{status, mode}        # mode: single | batched | batch
    # - analyzer_latency_seconds_bucket               # GGUF 추론 latency (CPU라 60~100s대까지 봐야 함)
    # - analyzer_parse_errors_total{mode}
    # - analyzer_batch_inference_size_bucket           # continuous batching 실측 배치 크기

# 4. Controller PodMonitoring (★ 신규 — V3엔 없던 agent loop 서비스)
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: controller-monitoring
  namespace: elastic
  labels:
    app: anomaly-controller
    tier: agent
spec:
  selector:
    matchLabels:
      app: anomaly-controller
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
    # 실제 수집되는 메트릭 (controller.py 기준):
    # - plan_requests_total{status}
    # - plan_action_total{action}                      # accept_verdict | expand_within_cluster | reroute_cross_cluster
    # - plan_lat4ency_seconds_bucket
    # - mcp_transport_latency_seconds_bucket{mode, tool, status}   # direct vs mcp vs mcp_native 비교
    # - detect_requests_total{status, track}
    # - detect_latency_seconds_bucket                  # end-to-end agent loop latency
    # - agent_round_total{action}
    # - agent_path_total{path}                          # fast+none / deep+expand / deep+reroute 등
    # - agent_loop_budget_exceeded_total
    # - agent_rounds_per_request_bucket
