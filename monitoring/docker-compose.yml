# docker-compose.yml
version: '3.8'
services:
  gmp-frontend:
    image: gke.gcr.io/prometheus-engine/frontend:v0.15.3-gke.0
    ports:
      - "19090:9090"
    volumes:
      - ./gmp-sa-key.json:/etc/gcp/key.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/etc/gcp/key.json
    command:
      - "--web.listen-address=:9090"
      - "--query.project-id=kakaoo-501107"
    restart: unless-stopped

  renderer:
    image: grafana/grafana-image-renderer:latest
    environment:
      - RENDERING_TOKEN=my-super-secret-token-12345    # 아무 문자열이나, 양쪽 동일하게
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=change-me
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=my-super-secret-token-12345   # ★ renderer와 동일 값
    volumes:
      - grafana-storage:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-storage: