# ===========================
# Local Analyzer ConfigMap
# ===========================

apiVersion: v1
kind: ConfigMap
metadata:
  name: local-analyzer-config
  namespace: elastic
  labels:
    app: local-analyzer
    tier: inference
data:
  # ── 실험 설정 ──────────────────────────────────────────────────
  EXPERIMENT_CASE:  "pca_64_k100"
  TEACHER_PROVIDER: "hf_0713"
  ADAPTER_TYPE:     "grpo"        # sft | grpo

  # ── GCS 설정 ───────────────────────────────────────────────────
  GCS_BUCKET:  "fraud_ecomm"
  GCS_FT_BASE: "tree-search/analyzer_ft"

  # ── 로컬 저장 경로 (init → main container 공유) ────────────────
  ADAPTER_LOCAL_DIR: "/data/adapter"

  # ── Base 모델 ──────────────────────────────────────────────────
  BASE_MODEL_ID: "Qwen/Qwen2.5-0.5B-Instruct"
  # BASE_MODEL_ID: "Qwen/Qwen2.5-3B-Instruct"

  # ── 추론 설정 ──────────────────────────────────────────────────
  MAX_NEW_TOKENS:  "40"   #default : 64, forward : 56
  DEVICE:          "cpu"
  # TORCH_DTYPE:     "float32"
  # OMP_NUM_THREADS: "2"
  TORCH_DTYPE:     "float32"
  OMP_NUM_THREADS: "2"

 # ── 서빙 백엔드 스위치 ───────────────────────────────────────
 # hf   : 기존 방식 (AutoModelForCausalLM + PeftModel merge, float32)
 # gguf : llama-cpp-python + Q4_K_M (NB02 Section 14 산출물)
  MODEL_BACKEND:  "gguf"    #hf
  GGUF_FILENAME:  "model_q4.gguf"
  N_CTX:          "768"    #default :2048

  # ── Distance 분포 (colab Section 5 실측값: pca_64_k100) ────────
  DIST_P25: "1.264"
  DIST_P50: "1.448"
  DIST_P75: "1.651"
  DIST_IQR: "0.387"

  # ── 분석 컨텍스트 플래그 ────────────────────────────────────────
  PERSONA_ENABLED:    "true"
  TREE_RULES_ENABLED: "false"

  ANALYZER_TASK: "agent"  #forward 동시 사용 // or agent

  ENABLE_KV_CACHE: "false"
  KV_CACHE_MB: "256"

---
# ===========================
# ServiceAccount (Workload Identity)
# ===========================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-analyzer
  namespace: elastic
  labels:
    app: local-analyzer
  annotations:
    iam.gke.io/gcp-service-account: anomaly-analyzer@kakaoo-501107.iam.gserviceaccount.com

---
# ===========================
# Deployment
# ===========================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-analyzer
  namespace: elastic
  labels:
    app: local-analyzer
    tier: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-analyzer
  template:
    metadata:
      labels:
        app: local-analyzer
        tier: inference
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: local-analyzer
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role
                operator: In
                values: ["app-node"]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: local-analyzer
              topologyKey: kubernetes.io/hostname

      # ── Init Container: GCS → 로컬 다운로드 ──────────────────
      initContainers:
      - name: download-adapter
        image: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
        command: ["bash", "-lc"]
        args:
          - |
            set -euo pipefail

            echo "[init] EXPERIMENT_CASE : ${EXPERIMENT_CASE}"
            echo "[init] TEACHER_PROVIDER: ${TEACHER_PROVIDER}"
            echo "[init] ADAPTER_TYPE    : ${ADAPTER_TYPE}"
            echo "[init] GCS_BUCKET      : ${GCS_BUCKET}"
            echo "[init] MODEL_BACKEND   : ${MODEL_BACKEND}"
            echo "[init] ANALYZER_TASK   : ${ANALYZER_TASK}"

            # gs://{GCS_BUCKET}/{GCS_FT_BASE}/{EXPERIMENT_CASE}/{TEACHER_PROVIDER}/{ANALYZER_TASK}_adapter_{ADAPTER_TYPE}/
            #   ├── README.md, adapter_config.json, adapter_model.safetensors, ... (hf 서빙용)
            #   └── gguf/
            #        ├── model_q4.gguf
            #        └── gguf_meta.json
            METHOD_PATH="gs://${GCS_BUCKET}/${GCS_FT_BASE}/${EXPERIMENT_CASE}/${TEACHER_PROVIDER}/${ANALYZER_TASK}_adapter_${ADAPTER_TYPE}"
            DEST="${ADAPTER_LOCAL_DIR}"

            echo "[init] GCS path  : ${METHOD_PATH}"
            echo "[init] Local dest: ${DEST}"
            mkdir -p "${DEST}"

            if [ "${MODEL_BACKEND}" = "gguf" ]; then
              # gguf/ 서브폴더 2개 파일만 받는다 (model_q4.gguf 1.9GB + gguf_meta.json)
              GCS_GGUF_DIR="${METHOD_PATH}/gguf"
              echo "[init] Downloading GGUF: ${GCS_GGUF_DIR}/${GGUF_FILENAME}"
              gsutil cp "${GCS_GGUF_DIR}/${GGUF_FILENAME}" "${DEST}/"
              gsutil cp "${GCS_GGUF_DIR}/gguf_meta.json" "${DEST}/" || true
            else
              # hf 백엔드는 adapter 파일만 필요 — gguf/ 서브폴더(model_q4.gguf,
              # 1.9GB)는 hf 서빙에 안 쓰이므로 제외하고 받는다.
              echo "[init] Downloading HF adapter (excluding gguf/)"
              gsutil -m rsync -r -x '^gguf/' "${METHOD_PATH}" "${DEST}"
            fi

            echo "[init] Download complete."
            ls -lh "${DEST}/"
            echo "[init] Total: $(du -sh ${DEST} | cut -f1)"

        # ConfigMap 전체를 envFrom으로 한번에 주입
        envFrom:
        - configMapRef:
            name: local-analyzer-config

        volumeMounts:
        - name: data-volume
          mountPath: /data

      # ── Main Container ─────────────────────────────────────────
      containers:
      - name: local-analyzer
        image: us-west1-docker.pkg.dev/kakaoo-501107/elasticsearch-images/local-analyzer:3.0
        imagePullPolicy: Always

        ports:
        - containerPort: 8080
          name: http
          protocol: TCP

        # ConfigMap 전체를 envFrom으로 한번에 주입
        # → local_analyzer.py에서 os.getenv()로 직접 참조
        envFrom:
        - configMapRef:
            name: local-analyzer-config

        # anomaly-config에서 추가로 필요한 값만 개별 주입
        env:
        - name: GOOGLE_CLOUD_PROJECT
          valueFrom:
            configMapKeyRef:
              name: anomaly-config
              key: GOOGLE_CLOUD_PROJECT

        volumeMounts:
        - name: data-volume
          mountPath: /data
        - name: code-volume
          mountPath: /app/local_analyzer.py
          subPath: local_analyzer.py
        - name: code-volume
          mountPath: /app/prompts.py
          subPath: prompts.py
        # - name: code-volume
        #   mountPath: /app/config.py
        #   subPath: config.py

        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 300
          timeoutSeconds: 5
          failureThreshold: 3 

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 120
          periodSeconds: 300
          timeoutSeconds: 3
          failureThreshold: 3 

        # resources:
        #   requests:
        #     cpu: "500m"
        #     memory: "512Mi"
        #   limits:
        #     cpu: "2000m"
        #     memory: "6Gi"

        # page fault 실험 위해, es db에 cpu 모두 할당
        resources:
          requests:
            cpu: "100m"      # 500m에서 하향 (Elasticsearch에 양보)
            memory: "512Mi"    # 모델 로딩 안정성을 위해 상향 (OOM 방지)
          limits:
            cpu: "2000m"     # 2000m에서 하향
            memory: "6Gi"    # 6Gi에서 하향 (클러스터 여유분 확보)

      volumes:
      - name: data-volume
        emptyDir: {}
      - name: code-volume
        configMap:
          name: local-analyzer-code

---
# ===========================
# Service (ClusterIP)
# ===========================

apiVersion: v1
kind: Service
metadata:
  name: local-analyzer
  namespace: elastic
  labels:
    app: local-analyzer
    tier: inference
spec:
  type: ClusterIP
  selector:
    app: local-analyzer
    tier: inference
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP

# ===========================
# 배포 절차
# ===========================
#
# 1. 코드 ConfigMap 생성/갱신 (local_analyzer.py + prompts.py + config.py):
#    kubectl create configmap local-analyzer-code \
#      --from-file=local_analyzer.py=apps/local_analyzer.py \
#      --from-file=prompts.py=apps/prompts.py \
#      --from-file=config.py=apps/config.py \
#      -n elastic --dry-run=client -o yaml | kubectl apply -f -
#
# 2. Deployment 적용:
#    kubectl apply -f 04-local-analyzer.yaml
#
# 3. init container 다운로드 로그 확인:
#    kubectl logs -n elastic -l app=local-analyzer -c download-adapter --follow
#
# 4. main container 모델 로딩 확인:
#    kubectl logs -n elastic -l app=local-analyzer -c local-analyzer --follow
#
# 5. Ready 확인:
#    kubectl rollout status deployment/local-analyzer -n elastic
#
# ===========================
# 어댑터 교체 (mined ↔ distance)
# ===========================
#
#    kubectl patch configmap local-analyzer-config -n elastic \
#      --type merge -p '{"data":{"ADAPTER_TYPE":"distance"}}'
#    kubectl rollout restart deployment/local-analyzer -n elastic
#
# ===========================
# 서빙 백엔드 전환 (hf ↔ gguf)
# ===========================
#
#    kubectl patch configmap local-analyzer-config -n elastic \
#      --type merge -p '{"data":{"MODEL_BACKEND":"hf"}}'
#    kubectl rollout restart deployment/local-analyzer -n elastic
#    # ※ init container가 재실행되며 emptyDir(/data)이 초기화되므로
#    #    백엔드에 맞는 파일만 다시 받는다 (gguf<->hf 전환 시 재다운로드 발생)
#
# ===========================
# orchestrator 전환
# ===========================
# #
#    kubectl set env deployment/anomaly-orchestrator \
#      ANALYZER_URL=http://local-analyzer:80 -n elastic