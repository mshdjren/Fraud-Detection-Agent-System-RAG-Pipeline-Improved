# ===========================
# 배포 절차
# ===========================
#
# 1. ConfigMap 등록 (최초 1회 + 파일 변경 시)
#
#    # 신규 — 새 4개 파일
#    kubectl create configmap evaluation-agent-eval-code \
#      --from-file=agent_batch_inference.py \
#      --from-file=agent_eval_metrics.py \
#      --from-file=agent_eval_report.py \
#      --from-file=agent_latency.py \
#      -n elastic --dry-run=client -o yaml | kubectl apply -f -
#
#    # 기존 evaluation-code 에 gt_loader.py / evaluation_metrics.py 있는지 확인
#    kubectl get configmap evaluation-code -n elastic -o yaml | grep "  [a-z].*\.py"
#
# 2. Job 1 실행 (추론)
#    kubectl apply -f agent-eval-batch.yaml
#    kubectl get job agent-eval-inference-pca64-k100-v14 -n elastic -w
#    kubectl logs -n elastic job/agent-eval-inference-pca64-k100-v14 --follow
#
# 3. Job 1 완료 후 Job 2 실행 (리포트)
#    # Job 1 완료 확인
#    kubectl wait --for=condition=complete job/agent-eval-inference-pca64-k100-v14 \
#      -n elastic --timeout=3600s
#    # Job 2 적용 (yaml에서 Job 2 부분만 apply, 또는 --field-selector로)
#    kubectl apply -f agent-eval-batch.yaml
#    kubectl logs -n elastic job/agent-eval-report-pca64-k100-v14 --follow
#
# 4. GCS에서 결과 확인
#    gsutil ls gs://fraudecom/evaluation/agent-eval/
#    gsutil cp gs://fraudecom/evaluation/agent-eval/plots/*.png ./
#
# ===========================
# 파라미터 변경 방법
# ===========================
#
# N_SAMPLES 늘리기 (정식 평가):
#   yaml에서 N_SAMPLES: "1000" 으로 수정 후 재apply
#
# boundary-only 실행:
#   BOUNDARY_ONLY: "true" 로 변경 후 재apply
#
# Job 재실행 (같은 이름 Job이 남아있으면 삭제 후 apply):
#   kubectl delete job agent-eval-inference-pca64-k100-v14 -n elastic
#   kubectl apply -f agent-eval-batch.yaml