#
# ===========================
# ENABLE_COMPARE_FEATURES 활성화 (Arm 3 실험 시)
# ===========================
#
#    kubectl patch configmap agent-tools-mcp-config -n elastic \
#      --type merge -p '{"data":{"ENABLE_COMPARE_FEATURES":"true"}}'
#    kubectl rollout restart deployment/agent-tools-mcp -n elastic
#    # controller 도 함께 재시작해야 플래그가 양쪽에 반영된다
#    kubectl rollout restart deployment/anomaly-controller -n elastic
#
# ===========================
# TOOL_EXECUTION_MODE 전환 (direct → mcp → mcp_native)
# ===========================
#
#    # controller 의 ConfigMap 을 변경하면 자동으로 반영됨
#    kubectl patch configmap anomaly-controller-config -n elastic \
#      --type merge -p '{"data":{"TOOL_EXECUTION_MODE":"mcp_native"}}'
#    kubectl rollout restart deployment/anomaly-controller -n elastic
#    # ※ agent-tools-mcp 자체는 재시작 불필요 — transport 수신 방식은
#    #   이미 streamable-http / REST shim 양쪽을 동시에 서빙 중이다.
