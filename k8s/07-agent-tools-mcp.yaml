# 1. 코드 ConfigMap 생성/갱신 (코드 변경 시마다):
#    kubectl create configmap agent-tools-mcp-code \
#      --from-file=agent_tools.py=apps/agent_tools.py \
#      --from-file=agent_tools_mcp_server.py=apps/agent_tools_mcp_server.py \
