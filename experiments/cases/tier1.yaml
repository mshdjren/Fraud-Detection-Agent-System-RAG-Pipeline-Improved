# =====================================================================
# tier1.yaml — 실험 축 단일 출처 (Single Source of Truth)
# =====================================================================
# 원칙:
#   1. 기존 배포 YAML은 건드리지 않는다. anomaly-config ConfigMap을
#      patch 하고 rollout restart 하는 것으로만 축을 바꾼다.
#   2. `indices`(재적재 필요, 비쌈)와 `groups`(재적재 0, 쌈)를 분리한다.
#      → 인덱스 1개 위에서 여러 run을 돌려 총 시간이 곱이 아니라 합이 된다.
#   3. OFAT(one-factor-at-a-time) — 조합 폭발을 만들지 않는다.
#   4. stage 로 구현/검증 순서를 통제한다.
#      stage 1 : A/B/C  — 검색 축 baseline (percolate / coreset / quant)
#      stage 2 : D/E    — 검색 파라미터 sweep (HNSW m·ef / num_candidates)
#                         → 여기서 best 운영점을 고정한다
#      stage 3 : F/G    — agent 축 (MCP transport / conditional re-retrieval)
#                         검색이 고정된 뒤에 measure 해야 교란이 없다
#      각 stage 가 초록불이 된 뒤에만 다음으로 넘어간다.
# =====================================================================

# ⚠ [DEBUG SWEEP] n_samples 는 전 그룹 20 으로 통일되어 있다.
#   모든 case 의 배관(patch → rollout → job → 수집 → 업로드)을 빠르게
#   검증하기 위한 값이며, 본 측정 시에는 A/B=60, C=100 수준으로 되돌린다.
version: 1
experiment_case: pca_64_k100
namespace: elastic
gcs_root: "gs://fraud_ecommm/experiments"
# agent-eval-batch.yaml 의 GCS_OUTPUT_BUCKET 과 동일해야 한다.
# Job 이 스스로 여기에 업로드하고, run_case.sh 가 여기서 산출물을 회수한다.
eval_gcs_base: "gs://fraud_ecommm/evaluation/agent-eval"

# 코드 ConfigMap 이름 (run 전 갱신 확인용)
code_configmaps:
  - es-scripts
  - router-code
  - retriever-code
  - controller-code
  - local-analyzer-code
  - evaluation-agent-eval-code

# 배포 파일 경로 (레포 루트 기준) — 렌더링 원본
manifests:
  ingest:      "k8s/01-ingest.yaml"
  agent_eval:  "k8s/batch-jobs/agent-eval-batch.yaml"

# ── 모든 run 공통 baseline ───────────────────────────────────────────
# 00-anomaly-config.yaml 대비 "실험이 고정하는 값"만 명시한다.
defaults:
  EXPERIMENT_CASE:          "pca_64_k100"
  INGEST_SEARCH_MODE:       "hnsw"          # → INGEST_VEC_INDEXED=True
  SEARCH_MODE:              "hnsw_filtered"
  VERSIONS:                 "v1"            # percolator 단일 적재
  PERCOLATE_QUERY_VERSION:  "v1"
  ENABLE_BUCKETIZATION:     "false"         # 서빙 기본 off (ingest 는 true)
  VEC_INDEX_CORESET_PCT:    "100"
  VEC_QUANT:                "f32"
  HNSW_M:                   "16"
  HNSW_EF_CONSTRUCTION:     "100"
  KNN_NUM_CANDIDATES:       "200"
  RETRIEVER_OVERSAMPLE:     "0"
  TOOL_EXECUTION_MODE:      "mcp_native"
  RESEARCH_MODE:            "v3"
  PIPELINE_MODE:            "agent"
  EVAL_SOURCE:              "smoke"

# ── 인덱스 적재 축 (ingest Job 1회 = index 1개) ──────────────────────
# ★ percolator 는 index_id=base 에서 ENABLE_BUCKETIZATION=true 로 딱 한 번만
#   적재한다. bucket 필드가 매핑에 있어도 router 가 false 면 prefilter 를
#   붙이지 않으므로, v1 / v14 / v14+bucket 3케이스를 재적재 없이 커버한다.
indices:
  - id: f32
    stage: 1
    ingest_percolator: true            # 이 인덱스 적재 시 percolator 도 함께
    config:
      VEC_QUANT:            "f32"
      HNSW_M:               "16"
      HNSW_EF_CONSTRUCTION: "100"
      CORESET_PERCENTAGES:  "100,10,1"
      ENABLE_BUCKETIZATION: "true"     # ← ingest 시점 (bucket 필드 생성)
      SKIP_RAW_VEC:         "false"

  - id: int8
    stage: 1
    ingest_percolator: false
    config:
      VEC_QUANT:            "int8_hnsw"
      HNSW_M:               "16"
      HNSW_EF_CONSTRUCTION: "100"
      CORESET_PERCENTAGES:  "100"
      SKIP_RAW_VEC:         "false"

  - id: bbq
    stage: 1
    ingest_percolator: false
    config:
      VEC_QUANT:            "bbq_hnsw"
      HNSW_M:               "16"
      HNSW_EF_CONSTRUCTION: "100"
      CORESET_PERCENTAGES:  "100"
      SKIP_RAW_VEC:         "false"

  # ── stage 2: HNSW 파라미터 sweep (CV 의 m/ef_construction 주장) ──
  - id: m32ef200
    stage: 2
    ingest_percolator: false
    config:
      VEC_QUANT:            "f32"
      HNSW_M:               "32"
      HNSW_EF_CONSTRUCTION: "200"
      CORESET_PERCENTAGES:  "100"
      SKIP_RAW_VEC:         "false"

  - id: m8ef64
    stage: 2
    ingest_percolator: false
    config:
      VEC_QUANT:            "f32"
      HNSW_M:               "8"
      HNSW_EF_CONSTRUCTION: "64"
      CORESET_PERCENTAGES:  "100"
      SKIP_RAW_VEC:         "false"

  # ── stage 4: percolator 샤드 분산 (H축) ────────────────────────
  # ★ percolate 는 "등록된 모든 쿼리를 입력 문서에 MemoryIndex 로 실행"하므로
  #   비용이 문서 수가 아니라 **샤드당 등록 쿼리 수**에 비례한다.
  #   샤드를 N 개로 나누면 각 샤드가 ~1/N 쿼리만 실행하고 병렬로 돌아
  #   일반 역색인과 달리 near-linear 로 스케일한다.
  #   단 같은 노드 안에서는 CPU 코어 수까지만 스케일한다(현재 1800m ≈ 1.8코어).
  #
  # inline: true  → 앞단 일괄 적재가 아니라 **각 run 직전에 재적재**한다.
  #   percolator 인덱스명에는 샤드 수가 안 들어가므로 매번 다시 만들어야 한다.
  # SKIP_RAW_VEC: true → vec 인덱스는 건드리지 않고 percolator 만 재적재(빠름).
  - id: perc_s1
    stage: 4
    inline: true
    ingest_percolator: true
    config:
      VERSIONS:              "v1"
      ENABLE_BUCKETIZATION:  "true"
      SKIP_RAW_VEC:          "true"      # ★ vec 재적재 생략
      N_SHARDS:              "1"
      PERCOLATOR_SHARD_DISTRIBUTION: "true"
      VEC_QUANT:             "f32"
      HNSW_M:                "16"
      HNSW_EF_CONSTRUCTION:  "100"

  - id: perc_s2
    stage: 4
    inline: true
    ingest_percolator: true
    config:
      VERSIONS:              "v1"
      ENABLE_BUCKETIZATION:  "true"
      SKIP_RAW_VEC:          "true"
      N_SHARDS:              "2"
      PERCOLATOR_SHARD_DISTRIBUTION: "true"
      VEC_QUANT:             "f32"
      HNSW_M:                "16"
      HNSW_EF_CONSTRUCTION:  "100"

  - id: perc_s4
    stage: 4
    inline: true
    ingest_percolator: true
    config:
      VERSIONS:              "v1"
      ENABLE_BUCKETIZATION:  "true"
      SKIP_RAW_VEC:          "true"
      N_SHARDS:              "4"
      PERCOLATOR_SHARD_DISTRIBUTION: "true"
      VEC_QUANT:             "f32"
      HNSW_M:                "16"
      HNSW_EF_CONSTRUCTION:  "100"

# ── 실행 축 (ConfigMap patch 만, 재적재 0) ───────────────────────────
#  eval          : 라벨 (concurrency/n_samples 기본값 결정용)
#  skip_analyzer : router percolate 스킵 + retriever cluster filter 제거.
#                  ★ 이건 LLM 을 끄는 플래그가 아니다 — controller 의
#                    analyzer 호출과 무관하다. 전역 벡터검색으로 경로가
#                    바뀌므로 서빙 경로와 달라진다. 기본 false.
#  ★ AGENT_CONCURRENCY 는 전 그룹 1 로 고정한다. LLM 이 개입하는 한
#    GKE free tier 에서 동시 요청은 local-analyzer rollout 을 유발한다.
groups:
  - id: A_percolate
    stage: 1
    index: f32
    eval: agent
    n_samples: 100
    concurrency: 1
    note: "CV C1 — 쿼리 버킷화 → Router Recall@5 +9%p, P99 −25% 재현"
    vary:
      - id: v1
        config: {PERCOLATE_QUERY_VERSION: "v1",  ENABLE_BUCKETIZATION: "false"}
      - id: v14
        config: {PERCOLATE_QUERY_VERSION: "v14", ENABLE_BUCKETIZATION: "false"}
      - id: v14bucket
        config: {PERCOLATE_QUERY_VERSION: "v14", ENABLE_BUCKETIZATION: "true"}

  - id: B_coreset
    stage: 1
    index: f32
    eval: agent
    n_samples: 100
    concurrency: 4
    note: "CV C2 — coreset 10% → 메모리 −89%, AUROC 손실 0.4%p 이내"
    vary:
      - id: cs100
        config: {VEC_INDEX_CORESET_PCT: "100"}
      - id: cs10
        config: {VEC_INDEX_CORESET_PCT: "10"}
      - id: cs1
        config: {VEC_INDEX_CORESET_PCT: "1"}

  - id: C_quant
    stage: 1
    eval: agent
    skip_analyzer: false               # 서빙과 동일 경로 — A/B 그룹과 apples-to-apples
    n_samples: 100
    concurrency: 4
    note: "CV C3 — int8/BBQ. rescore 유무가 nd 절대 스케일에 미치는 영향까지 관측"
    vary:
      - id: f32
        index: f32
        config: {VEC_QUANT: "f32",       RETRIEVER_OVERSAMPLE: "0"}
      - id: int8os0
        index: int8
        config: {VEC_QUANT: "int8_hnsw", RETRIEVER_OVERSAMPLE: "0"}
      - id: int8os3
        index: int8
        config: {VEC_QUANT: "int8_hnsw", RETRIEVER_OVERSAMPLE: "3.0"}
      - id: bbqos3
        index: bbq
        config: {VEC_QUANT: "bbq_hnsw",  RETRIEVER_OVERSAMPLE: "3.0"}

  # ── stage 2 ────────────────────────────────────────────────────────
  - id: D_hnsw
    stage: 2
    eval: agent
    n_samples: 100
    concurrency: 4
    note: "CV C7 — m/ef_construction sweep"
    vary:
      - {id: s0, index: f32,       config: {HNSW_M: "16", HNSW_EF_CONSTRUCTION: "100"}}
      - {id: s1, index: m32ef200,  config: {HNSW_M: "32", HNSW_EF_CONSTRUCTION: "200"}}
      - {id: s2, index: m8ef64,    config: {HNSW_M: "8",  HNSW_EF_CONSTRUCTION: "64"}}

  - id: E_numcand
    stage: 2
    index: f32
    eval: agent
    n_samples: 20
    concurrency: 4
    note: "recall-latency 곡선 (재적재 0)"
    vary:
      - {id: nc50,  config: {KNN_NUM_CANDIDATES: "50"}}
      - {id: nc100, config: {KNN_NUM_CANDIDATES: "100"}}
      - {id: nc200, config: {KNN_NUM_CANDIDATES: "200"}}
      - {id: nc400, config: {KNN_NUM_CANDIDATES: "400"}}

  - id: F_mcp
    stage: 3
    index: f32
    eval: agent
    n_samples: 20
    concurrency: 1
    note: "CV C4 — MCP 3-axis transport overhead P95"
    vary:
      - {id: direct,     config: {TOOL_EXECUTION_MODE: "direct"}}
      - {id: mcp,        config: {TOOL_EXECUTION_MODE: "mcp"}}
      - {id: mcpnative,  config: {TOOL_EXECUTION_MODE: "mcp_native"}}

  - id: I_bucket
    stage: 2
    index: f32
    eval: agent
    n_samples: 100
    concurrency: 4
    note: "bucket prefilter 튜닝 — v14bucket 의 routing_acc 0.25 붕괴 규명"
    config: {PERCOLATE_QUERY_VERSION: "v14", ENABLE_BUCKETIZATION: "true"}
    vary:
      # tolerance = 매칭 허용 버킷 반경(±N), min_match = 최소 일치 feature 수(총 9개)
      # 느슨할수록 많은 룰이 통과 → percolate 점수 서열이 희석돼 top-1 이 흔들린다.
      - {id: t2m3, config: {BUCKET_TOLERANCE: "2", BUCKET_MIN_MATCH: "3"}}   # 현재 기본값
      - {id: t1m5, config: {BUCKET_TOLERANCE: "1", BUCKET_MIN_MATCH: "5"}}
      - {id: t0m7, config: {BUCKET_TOLERANCE: "0", BUCKET_MIN_MATCH: "7"}}   # 가장 엄격
      - {id: t1m3, config: {BUCKET_TOLERANCE: "1", BUCKET_MIN_MATCH: "3"}}

  - id: H_percshard
    stage: 4
    eval: agent
    n_samples: 20
    concurrency: 4
    note: "percolate 샤드 분산 — 등록 쿼리 5,725개를 N 샤드로 병렬 실행"
    vary:
      - {id: s1, index: perc_s1, config: {N_SHARDS: "1", PERCOLATE_QUERY_VERSION: "v14", ENABLE_BUCKETIZATION: "true"}}
      - {id: s2, index: perc_s2, config: {N_SHARDS: "2", PERCOLATE_QUERY_VERSION: "v14", ENABLE_BUCKETIZATION: "true"}}
      - {id: s4, index: perc_s4, config: {N_SHARDS: "4", PERCOLATE_QUERY_VERSION: "v14", ENABLE_BUCKETIZATION: "true"}}

  - id: G_toolgate
    stage: 3
    index: f32
    eval: agent
    n_samples: 20
    concurrency: 4
    note: "CV C6 — conditional re-retrieval 유무"
    vary:
      - {id: gateon,  config: {TOOL_GATE_ENABLE: "true"}}
      - {id: gateoff, config: {TOOL_GATE_ENABLE: "false"}}

# ── 직렬 실행 안전장치 ───────────────────────────────────────────────
# GKE free tier 에서 local-analyzer 가 동시 요청에 rollout 되는 문제 대응.
serialization:
  # run 사이 대기 (pod 안정화 + page cache 정리)
  cooldown_s: 10
  # rollout / job 대기 상한
  rollout_timeout_s: 600
  ingest_timeout_s:  5400
  eval_timeout_s:    10800
  # 재기동 후 warmup 요청 수 (모델 로드·JVM·page cache)
  warmup_requests: 2
  # 이 deployment 들의 RESTARTS 를 run 전후로 비교해 오염 여부 판정
  watch_deployments:
    - anomaly-router
    - anomaly-retriever
    - local-analyzer
    - anomaly-controller
    - anomaly-orchestrator
